# ============================================================================
# 정적 장애물 충돌 config  —  사전제공 CAD 장애물 (동적/perception 아님)
# ----------------------------------------------------------------------------
# 단일 소스: 이 파일 하나가 (1) MoveIt planning scene [sim+real 충돌체크 공용]
# 과 (2) Isaac scene [sim 시각/콜라이더] 을 동시에 구동한다. pose 는 fixed_frame
# (로봇 base 고정 프레임) 기준이라 sim == real. 기구팀이 STEP/STL 을 주면 cad_dir 에
# 넣고 여기 한 줄 추가하면 된다(EOAT 파이프라인과 동일 패턴).
# ============================================================================
meta:
  fixed_frame: world              # 장애물 pose 기준 프레임(로봇 base 고정). MoveIt planning frame 과 일치해야 함.
  cad_dir: ../../assets/cad/obstacles          # 기구팀 STEP/STL 원본
  out_usd_dir: ../../assets/obstacles          # 변환된 USD(Isaac) + 콜라이더 메시(MoveIt)
  defaults:
    # 충돌 형상 표현 (per-obstacle override 가능; 빽빽한 환경이면 정확도 중요):
    #   mesh                = 실제 표면 그대로(decimate 로 삼각형 수만 줄임). 안 커짐 → 비과보수. ★기본
    #   convexDecomposition = CoACD 볼록조각 병합(오목 따라감, 경량). mesh 와 convex 의 중간.
    #   convex              = 단일 볼록껍질(가장 경량이나 오목부 메꿔 커짐 → 보수적).
    #   box                 = 바운딩 박스(테이블/벽 등 단순형).
    # prepare_obstacles.py 는 CAD 마다 mesh/convexDecomposition/convex 셋 다 산출 → 재변환 없이 전환.
    # 점진 점검: load_obstacles_moveit.py --level mesh|convexDecomposition|convex 로 전역 전환.
    # 참고: Isaac 물리 콜라이더는 항상 convexDecomposition(native, 경량) — MoveIt 표현과 독립.
    collision: mesh
    # 충돌 메시 tessellation LOD (STEP→mesh 변환 시). 0(거침)~4(정밀). 충돌엔 낮게.
    lod: 1

# ---- 장애물 목록 --------------------------------------------------------
# id                : 고유 이름 (MoveIt CollisionObject id + Isaac prim 이름)
# cad               : (선택) STEP/STL/… 파일명(cad_dir 기준). 없으면 primitive(box) 로만.
# collision         : convex | box | mesh   (없으면 defaults.collision)
# size              : box 일 때 [x,y,z] (m)
# pose              : {xyz[m], rpy[deg]}  — fixed_frame 기준
# allowed_collisions: 이 장애물과 충돌을 "허용"할 로봇 링크들 (ACM). 로봇이 얹혀있거나
#                     닿아있는 구조(테이블 등)의 자기충돌 오탐을 막는다.
obstacles:
  # ── UR16e 베이스 플레이트 (로봇이 얹히는 직육면체 판) — 지금은 임의 box 플레이스홀더 ──
  #   ★ 나중에 기구팀 STEP 이 오면 이 항목만 교체: `collision: box`+`size` → `cad: base_plate.step`
  #     (+ pose 실측). 지금은 아래 size/pose 숫자만 바꿔도 됨(파라미터화). CAD_DELIVERY_REQUEST.md §6.
  #   윗면 z=0(= base_link 장착면)에 맞춤, 두께는 -Z 로. --ground-z 기본 -0.05 = 이 판의 바닥면.
  #   로봇 베이스가 이 판에 얹혀 "닿아 있으므로" 그 접촉만 ACM 으로 허용(팔/EOAT 충돌은 정상 검출).
  - id: base_plate
    collision: box
    size: [0.30, 0.30, 0.05]                          # ★ 임의 치수(30×30cm·두께 50mm) — STEP 오면 교체
    pose: {xyz: [0.0, 0.0, -0.025], rpy: [0, 0, 0]}   # 중심 z=-0.025 → 윗면 z=0, 바닥 z=-0.05
    allowed_collisions: [base_link, base_link_inertia]  # 로봇이 얹힘 → 접촉 허용(ACM)

  # ── (선택/데모) 큰 작업대 테이블 — 최소 씬에선 비활성. 필요하면 주석 해제 ──
  # - id: table
  #   collision: box
  #   size: [1.2, 0.8, 0.72]                          # 표준 작업대 크기
  #   pose: {xyz: [0.15, 0.0, -0.36], rpy: [0, 0, 0]}   # 윗면 z=0
  #   allowed_collisions: [base_link, base_link_inertia]

  # ── 삽입 타깃 Shaft (정적) — CAD_DELIVERY_REQUEST.md §7 ──
  # 별도 STEP 으로 받아 축(+Z)·입구 원점 유지. 삽입 접근 외에는 회피 대상이라 ACM 없음.
  # (휠↔샤프트의 삽입 접촉은 MoveIt 플래닝이 아니라 Isaac 물리에서 다룸. 삽입 단계에서
  #  attached wheel ↔ shaft 충돌 오탐이 나면 그때만 한시적으로 ACM 을 추가.)
  # - id: shaft
  #   cad: shaft.step
  #   collision: mesh                            # 삽입 clearance 정확도 위해 실메시
  #   pose: {xyz: [0.55, 0.0, 0.10], rpy: [0, 0, 0]}   # 셀 조립 STEP 에서 실측 추출 권장

  # 예시 CAD 장애물 (기구팀 STEP/STL). 파일을 cad_dir 에 넣고 주석 해제:
  # - id: fixture_a
  #   cad: fixture_a.step          # 또는 fixture_a.stl
  #   collision: convex            # 밀집 mesh 회피 → convex 권장
  #   pose: {xyz: [0.5, 0.25, 0.1], rpy: [0, 0, 0]}
  #   # allowed_collisions: []     # 로봇과 닿지 않는 장애물은 비움

# ── 조작 대상물 Wheel (동적) 참고 ────────────────────────────────────────────
# Wheel 은 "장애물"이 아니라 그리퍼가 집는 동적 물체라 이 파일에 넣지 않습니다.
#   · 충돌 감지(플래닝): 파지 시 MoveIt "attached collision object" 로 gripper 링크에 부착
#     → 팔이 휠째로 주변과 충돌하는지 검사(부착/해제는 pick/place 시점에 런타임 처리).
#   · 파지·삽입 물리: Isaac 에서 동적 강체 + 마찰재질(접촉). CAD_DELIVERY_REQUEST.md §7 조건으로 수령.
# 별도 STEP(보어축=+Z, 물성 포함)으로 받아 두면 위 두 경로에 그대로 투입됩니다.
