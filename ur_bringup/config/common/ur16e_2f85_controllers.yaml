# ros2_control configuration for the UR16e + Robotiq 2F-85 Isaac Sim backend.
# Standalone copy of ur16e_controllers.yaml (the arm-only file is left
# untouched) with a gripper_controller added for finger_joint.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz. Keep BELOW the Isaac /clock rate (~250 Hz) under
                      # use_sim_time, else the CM loop starves the topic_based
                      # hardware callback (NaN states).

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Named to match ur_moveit_config's default so MoveIt config is reused.
    scaled_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Robotiq 2F-85: GripperCommand action on the single finger_joint.
    gripper_controller:
      type: position_controllers/GripperActionController

    # STREAMING position controller — for teleop (MoveIt Servo) and, later, for
    # running a learned policy (IL/VLA or RL) that emits per-step joint targets.
    #
    # Why a second arm controller: scaled_joint_trajectory_controller is
    # TRAJECTORY based (waypoints + timing). Feeding it single-step targets at
    # 30-100 Hz gives jerky/overshooting motion. See
    # ur_bringup/docs/plan_il_vla.md 2.3.
    #
    # ** Mutually exclusive with scaled_joint_trajectory_controller ** — both
    # claim the same position command interfaces, so only one may be active.
    # Spawn this one INACTIVE and switch with isaac/common/switch_control_mode.py.
    forward_position_controller:
      type: position_controllers/JointGroupPositionController

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # cuMotion (GPU) trajectories end with a tiny non-zero terminal velocity
    # (numerical, ~1e-3 rad/s); the JTC rejects the goal by default ("Velocity of
    # last trajectory point ... is not zero"). Allow it — harmless for OMPL/other
    # planners whose terminal velocity is already zero.
    allow_nonzero_velocity_at_trajectory_end: true

forward_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    # Joint ORDER above is the contract for /forward_position_controller/commands
    # (std_msgs/Float64MultiArray). MoveIt Servo publishes in the move group's
    # order, which for ur_manipulator (base_link -> tool0) is exactly this.
    interface_name: position

gripper_controller:
  ros__parameters:
    joint: finger_joint
    # 2F-85 finger_joint travel: 0.0 (open) .. ~0.8 rad (closed).
    allow_stalling: true        # holding a closed grip stalls the joint; treat as success
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
    goal_tolerance: 0.05
    max_effort: 100.0
