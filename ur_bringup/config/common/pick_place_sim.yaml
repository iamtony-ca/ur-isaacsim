# pick_place_demo.py -- SIM-ONLY overrides.
#
# THIS FILE IS INTENTIONALLY EMPTY OF OVERRIDES (2026-09-09).
#
# It used to carry two, and both turned out to be mistakes rather than genuine
# sim/real differences:
#   * tcp_offset 0.1294 -- the demo was treating finger_tip_link's ORIGIN as the
#     pad. Wrong on real hardware too; fixed in measure_tcp_offset() + pad_offset.
#   * grip_approach 0.30 -- a workaround for a gripper convention that was never
#     inverted. Photographing the wrist camera at each opening showed the asset
#     matches the URDF (0 = open). See HISTORY.md 28.
#
# Sim and real therefore run identical parameters today. Keep the file and the
# launch wiring: the seam is worth having the moment a real difference appears,
# and an empty seam is the honest way to say "there is none right now".
/**:
  ros__parameters: {}
